<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Pattern-16 · Drum Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0c0a09;
    --bg-1: #15110e;
    --bg-2: #1c1813;
    --bg-3: #251f19;
    --panel: #1a1612;
    --panel-edge: #0a0807;
    --line: #2a231d;
    --line-2: #3a3128;
    --ink: #e7dccc;
    --ink-dim: #9a8d7d;
    --ink-faint: #5c5347;
    --accent: oklch(0.78 0.16 65);            /* warm amber */
    --accent-soft: oklch(0.78 0.16 65 / 0.22);
    --accent-glow: oklch(0.85 0.16 70 / 0.55);
    --teal: oklch(0.78 0.13 195);             /* delay accent */
    --teal-soft: oklch(0.78 0.13 195 / 0.25);
    --teal-glow: oklch(0.85 0.13 200 / 0.55);
    --red: oklch(0.65 0.20 25);
    --green: oklch(0.74 0.14 145);
    --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.04), inset 0 -1px 0 rgba(0,0,0,0.5);
    --rad: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #060403; color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace; min-height: 100vh; }
  #root { width: 100%; display: flex; justify-content: center; }
  body {
    background:
      radial-gradient(1200px 800px at 50% -10%, rgba(255, 180, 90, 0.04), transparent 60%),
      radial-gradient(800px 600px at 80% 110%, rgba(255, 130, 50, 0.03), transparent 60%),
      #050302;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 4px;
  }
  button { font-family: inherit; cursor: pointer; }

  /* --- Splash --- */
  .splash { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,3,2,0.94); backdrop-filter: blur(8px); z-index: 50; cursor: pointer; }
  .splash-card { position: relative; width: min(560px, 88vw); padding: 48px 44px; border-radius: 18px; background: linear-gradient(180deg, #1a1612, #100c09); border: 1px solid var(--line); box-shadow: 0 30px 90px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04); overflow: hidden; text-align: center; }
  .splash-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; padding: 12px; opacity: 0.15; pointer-events: none; }
  .splash-grid span { background: var(--accent); border-radius: 2px; animation: splashPulse 2.4s ease-in-out infinite; }
  @keyframes splashPulse { 0%, 100% { opacity: 0.05; } 50% { opacity: 0.5; } }
  .splash-text { position: relative; }
  .splash-eyebrow { font-size: 11px; letter-spacing: 0.3em; color: var(--accent); opacity: 0.8; margin-bottom: 14px; }
  .splash-card h1 { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; letter-spacing: -0.01em; color: var(--ink); }
  .splash-card p { color: var(--ink-dim); font-size: 12px; letter-spacing: 0.05em; margin: 0 0 30px; }
  .splash-share-status {
    margin: 0 auto 20px;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    border: 1px solid var(--line);
  }
  .splash-share-status.loading {
    color: var(--ink-dim);
    background: rgba(60, 50, 40, 0.2);
  }
  .splash-share-status.ready {
    color: oklch(0.85 0.13 145);
    border-color: oklch(0.5 0.14 145 / 0.5);
    background: oklch(0.2 0.06 145 / 0.18);
    box-shadow: 0 0 12px oklch(0.55 0.14 145 / 0.2);
  }
  .splash-share-status.ready strong { color: var(--accent); font-weight: 700; margin-left: 4px; }
  .splash-share-status.failed {
    color: oklch(0.78 0.13 30);
    border-color: oklch(0.45 0.16 30 / 0.55);
    background: oklch(0.2 0.06 30 / 0.18);
  }
  .splash-btn { position: relative; display: inline-flex; align-items: center; gap: 12px; padding: 14px 28px; font-size: 12px; letter-spacing: 0.25em; color: #1a1108; background: var(--accent); border: none; border-radius: 999px; font-weight: 700; box-shadow: 0 0 0 4px rgba(245, 168, 80, 0.18), 0 10px 30px rgba(245, 168, 80, 0.35); transition: transform 0.12s, box-shadow 0.18s; }
  .splash-btn:hover { transform: translateY(-1px); box-shadow: 0 0 0 5px rgba(245, 168, 80, 0.22), 0 14px 36px rgba(245, 168, 80, 0.45); }
  .splash-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #1a1108; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* --- Machine shell --- */
  .machine {
    width: 100%;
    max-width: 1440px;
    background: linear-gradient(180deg, #1f1a14 0%, #15110d 100%);
    border-radius: 14px;
    border: 1px solid #0a0807;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 0 0 1px #2b2319 inset,
      0 30px 90px rgba(0,0,0,0.8),
      0 60px 120px rgba(0,0,0,0.5);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
  }
  .machine::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 18%, transparent 82%, rgba(0,0,0,0.4));
  }

  /* --- Chrome --- */
  .chrome { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px 8px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark { display: grid; grid-template-columns: repeat(2, 8px); grid-template-rows: repeat(2, 8px); gap: 2px; }
  .brand-mark span { background: var(--accent); border-radius: 1px; opacity: 0.7; }
  .brand-mark span:nth-child(1) { opacity: 1; }
  .brand-name { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.18em; color: var(--ink); white-space: nowrap; }
  .brand-sub { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); margin-top: 2px; white-space: nowrap; }
  .screws { display: flex; gap: 12px; }
  .screws span { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a3f33, #1a140e 70%); box-shadow: inset 0 0 0 1px #0a0805, 0 1px 0 rgba(255,255,255,0.05); position: relative; }
  .screws span::after { content: ''; position: absolute; inset: 3px; border-top: 1px solid rgba(255,255,255,0.1); transform: rotate(28deg); }

  /* --- Transport (2-row layout: top has playback+modulation, bottom is the
     full-width selection strip for banks/chain/kit/patterns) --- */
  .transport {
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: linear-gradient(180deg, #15110d, #100c09);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 14px 18px;
    box-shadow: var(--shadow-inset);
  }
  .transport-top {
    display: flex;
    align-items: stretch;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: space-between;
  }
  .transport-bottom {
    display: flex;
    align-items: flex-end;
    gap: 22px;
    flex-wrap: wrap;
    padding-top: 12px;
    border-top: 1px dashed rgba(60, 50, 40, 0.4);
  }
  .transport-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .transport-right { display: flex; align-items: stretch; gap: 14px; }

  /* Play button */
  .play {
    position: relative;
    width: 86px; height: 56px;
    border-radius: 10px;
    border: 1px solid #2a221a;
    background: linear-gradient(180deg, #2a2218, #18130d);
    color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 0 #050302, inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.08s, box-shadow 0.18s, background 0.18s;
  }
  .play:hover { background: linear-gradient(180deg, #322820, #1d1812); }
  .play:active { transform: translateY(1px); box-shadow: 0 1px 0 #050302, inset 0 1px 0 rgba(255,255,255,0.05); }
  .play.on { background: linear-gradient(180deg, oklch(0.78 0.16 65), oklch(0.62 0.18 55)); color: #1a0f04; border-color: oklch(0.5 0.15 50); box-shadow: 0 2px 0 #050302, inset 0 1px 0 rgba(255,255,255,0.2), 0 0 24px rgba(245, 168, 80, 0.45); }
  .play-glow { position: absolute; inset: -6px; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
  .play.on .play-glow { opacity: 1; box-shadow: 0 0 30px rgba(245,168,80,0.35); }
  .play-label { font-size: 10px; letter-spacing: 0.2em; font-weight: 700; }

  /* Export button */
  .export-btn {
    height: 56px;
    padding: 0 14px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.2em;
    box-shadow: var(--shadow-inset);
    transition: all 0.15s;
  }
  .export-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--line-2); transform: translateY(-1px); }
  .export-btn:disabled, .export-btn.busy { opacity: 0.5; cursor: not-allowed; }

  /* BPM */
  .bpm {
    display: flex; flex-direction: column;
    background: #100c09;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px 4px;
    user-select: none;
    cursor: ns-resize;
    min-width: 130px;
  }
  .bpm-label { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); }
  .bpm-val { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .bpm-step { width: 22px; height: 22px; background: transparent; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 4px; font-size: 14px; line-height: 1; display: grid; place-items: center; }
  .bpm-step:hover { color: var(--accent); border-color: var(--line-2); }
  .bpm-num { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 26px; color: var(--accent); letter-spacing: -0.02em; text-shadow: 0 0 12px rgba(245,168,80,0.4); min-width: 56px; text-align: center; }

  /* Step meter */
  .meter { background: #100c09; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 4px; min-width: 84px; }
  .meter-label { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); }
  .meter-val { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 22px; color: var(--ink); }

  /* Selection sections share the transport-bottom row and align by their controls */
  .bankbar, .chain, .presets-panel, .kits-panel { min-width: 0; }
  .chain-cells, .presets-row, .bankbar-row { flex-wrap: wrap; }
  .band-label { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .band-sub { color: var(--accent); opacity: 0.7; letter-spacing: 0.18em; }

  /* Banks */
  .bankbar { display: flex; flex-direction: column; }
  .bankbar-row { display: flex; gap: 4px; align-items: flex-start; }
  /* Each bank shows the letter button + a chord abbreviation underneath */
  .bank-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bank-chord-badge {
    background: transparent;
    border: 1px solid transparent;
    color: var(--accent);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 4px;
    border-radius: 3px;
    min-width: 30px;
    text-align: center;
    cursor: pointer;
    transition: all 0.12s;
  }
  .bank-chord-badge:hover { border-color: var(--line-2); background: rgba(60,50,40,0.2); }
  .bank-chord-badge.unset { color: var(--ink-faint); }
  .bank-chord-popover { width: 320px; }
  .bank-chord-section { margin-bottom: 10px; }
  .bank-chord-section:last-of-type { margin-bottom: 4px; }
  .bank-chord-label {
    font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); margin-bottom: 4px;
  }
  .bank-chord-roots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
  .bank-chord-root {
    height: 22px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 3px;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700; font-size: 10px;
    transition: all 0.12s;
  }
  .bank-chord-root:hover { color: var(--ink); border-color: var(--line-2); }
  .bank-chord-root.on {
    color: var(--accent);
    background: linear-gradient(180deg, #2b2014, #1a130c);
    border-color: oklch(0.55 0.14 60);
    box-shadow: 0 0 0 1px oklch(0.55 0.14 60 / 0.4);
  }
  .bank-chord-types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .bank-chord-type {
    height: 22px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    transition: all 0.12s;
  }
  .bank-chord-type:hover { color: var(--ink); border-color: var(--line-2); }
  .bank-chord-type.on {
    color: var(--accent);
    background: linear-gradient(180deg, #2b2014, #1a130c);
    border-color: oklch(0.55 0.14 60);
  }
  .bank {
    position: relative;
    width: 30px; height: 30px;
    border-radius: 6px;
    background: linear-gradient(180deg, #1c1812, #110d09);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    display: grid; place-items: center;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700; font-size: 13px;
    box-shadow: var(--shadow-inset);
    transition: all 0.12s;
  }
  .bank:hover { color: var(--ink); border-color: var(--line-2); }
  .bank.populated { color: var(--ink); }
  .bank.editing {
    background: linear-gradient(180deg, oklch(0.78 0.16 65), oklch(0.62 0.18 55));
    color: #1a0f04;
    border-color: oklch(0.5 0.15 50);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 12px rgba(245,168,80,0.4);
  }
  .bank-play-led {
    position: absolute;
    top: 3px; right: 3px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: transparent;
    transition: all 0.15s;
  }
  .bank.playing .bank-play-led {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: bankPulse 0.5s ease-in-out infinite alternate;
  }
  .bank.editing.playing .bank-play-led {
    background: #1a0f04;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
  }
  @keyframes bankPulse { from { opacity: 0.55; } to { opacity: 1; } }

  /* Chain */
  .chain { display: flex; flex-direction: column; min-width: 0; }
  .chain-cells { display: flex; gap: 3px; }
  .chain-cell {
    width: 26px; height: 30px;
    border-radius: 5px;
    background: linear-gradient(180deg, #1c1812, #110d09);
    border: 1px solid #5a4d3f;
    color: var(--ink);
    display: grid; place-items: center;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700; font-size: 12px;
    box-shadow: var(--shadow-inset);
    transition: all 0.12s;
    position: relative;
  }
  .chain-cell:hover { border-color: #7a6a55; transform: translateY(-1px); }
  .chain-cell.empty { color: var(--ink-faint); }
  .chain-cell.pad { opacity: 1; background: #15110d; cursor: not-allowed; border-color: #4a3f33; }
  .chain-cell.pad .chain-dash { color: #6a5d4d; opacity: 1; }
  .chain-cell.add { color: var(--ink-faint); border-style: dashed; }
  .chain-cell.add:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  .chain-add { font-size: 16px; line-height: 1; font-weight: 400; }
  .chain-cell.active {
    color: #1a0f04;
    background: linear-gradient(180deg, var(--accent), oklch(0.62 0.18 55));
    border-color: oklch(0.5 0.15 50);
    box-shadow: 0 0 14px rgba(245, 168, 80, 0.55), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .chain-cell:nth-child(4n) { margin-right: 3px; }
  .chain-dash { opacity: 0.5; }

  /* Kits */
  .kits-panel { display: flex; flex-direction: column; }
  .kit-button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px;
    padding: 0 10px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    box-shadow: var(--shadow-inset);
    transition: all 0.15s;
  }
  .kit-button-label { white-space: nowrap; }
  .kit-button:hover { color: var(--ink); border-color: var(--line-2); transform: translateY(-1px); }
  .kit-button.on {
    color: var(--accent); border-color: oklch(0.55 0.14 60);
    background: linear-gradient(180deg, #2b2014, #1a130c);
    box-shadow: 0 0 0 1px oklch(0.55 0.14 60 / 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .kit-button.on .preset-led { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .kit-chevron { font-size: 11px; opacity: 0.6; letter-spacing: 0; }

  /* Patterns */
  .presets-panel { display: flex; flex-direction: column; }
  .presets-row { display: flex; gap: 6px; }
  .preset {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px;
    padding: 0 12px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 6px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
    transition: all 0.15s;
    box-shadow: var(--shadow-inset);
  }
  .preset:hover { color: var(--ink); border-color: var(--line-2); transform: translateY(-1px); }
  .preset.active { color: var(--accent); border-color: oklch(0.55 0.14 60); background: linear-gradient(180deg, #2b2014, #1a130c); box-shadow: 0 0 0 1px oklch(0.55 0.14 60 / 0.4), inset 0 1px 0 rgba(255,255,255,0.05); }
  .preset-led { width: 6px; height: 6px; border-radius: 50%; background: #2a221a; box-shadow: inset 0 0 0 1px #050302; }
  .preset.active .preset-led { background: var(--accent); box-shadow: 0 0 8px var(--accent), inset 0 0 0 1px rgba(255,255,255,0.3); }
  .preset.clear .preset-led { background: #3a2a25; }
  .preset.clear:hover .preset-led { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* Sends panel houses swing + reverb + delay (all per-bank modulation) */
  .sends-panel {
    display: flex;
    flex-direction: column;
    background: #100c09;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px 8px;
    gap: 4px;
    min-width: 260px;
  }
  .sends-header { display: flex; justify-content: space-between; align-items: center; }
  .sends-title { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); }
  .delay-time { display: inline-flex; gap: 2px; background: #0a0807; border: 1px solid var(--line); border-radius: 5px; padding: 2px; }
  .dt-opt {
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    padding: 3px 6px;
    border-radius: 3px;
    transition: all 0.12s;
  }
  .dt-opt:hover { color: var(--ink-dim); }
  .dt-opt.on { color: #1a0f04; background: var(--teal); box-shadow: 0 0 8px var(--teal-glow); }
  .sends-knobs { display: flex; gap: 6px; align-items: flex-end; justify-content: space-around; }
  .sends-knobs .knob-wrap + .knob-wrap { border-left: 1px dashed rgba(60, 50, 40, 0.5); padding-left: 4px; }

  /* Knob */
  .knob-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .knob { position: relative; }
  .knob-ticks { position: absolute; inset: 0; }
  .knob-tick { position: absolute; top: 50%; left: 50%; width: 2px; height: 4px; background: #2a221a; transform-origin: 50% 0; margin-left: -1px; margin-top: -2px; border-radius: 1px; }
  .knob-body {
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a2f24, #1a140e 70%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.1),
      inset 0 -2px 4px rgba(0,0,0,0.5),
      0 4px 8px rgba(0,0,0,0.5),
      0 0 0 1px #050302;
    cursor: ns-resize;
    transition: transform 0.05s;
  }
  .knob-indicator {
    position: absolute;
    top: 4px; left: 50%;
    width: 3px; height: 11px;
    background: var(--accent);
    border-radius: 2px;
    margin-left: -1.5px;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .knob-cap { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .knob-cap span { font-size: 9px; color: var(--accent); font-weight: 700; letter-spacing: 0.1em; opacity: 0.75; margin-top: 18px; }
  .knob-label { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); }

  /* Mini send knob (per-row R/D) */
  .mini-send {
    position: relative;
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: ns-resize;
    user-select: none;
    flex-shrink: 0;
  }
  .mini-send-body {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2218, #100c09 70%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.08),
      inset 0 -1px 2px rgba(0,0,0,0.5),
      0 0 0 1px #050302;
    transition: box-shadow 0.15s;
  }
  .mini-send-ind {
    position: absolute;
    top: 2px; left: 50%;
    width: 2px; height: 5px;
    margin-left: -1px;
    border-radius: 1px;
    background: #5c5347;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .mini-send.active.rev .mini-send-ind { background: var(--accent); box-shadow: 0 0 4px var(--accent); }
  .mini-send.active.del .mini-send-ind { background: var(--teal); box-shadow: 0 0 4px var(--teal); }
  .mini-send.active.rev .mini-send-body { box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 0 0 1px oklch(0.55 0.14 60 / 0.55), 0 0 6px rgba(245, 168, 80, 0.25); }
  .mini-send.active.del .mini-send-body { box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 0 0 1px oklch(0.55 0.10 195 / 0.55), 0 0 6px rgba(80, 220, 230, 0.25); }
  .mini-send-letter {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 8px;
    color: var(--ink-faint);
    font-weight: 700;
    letter-spacing: 0.04em;
    pointer-events: none;
    margin-top: 8px;
  }
  .mini-send.active.rev .mini-send-letter { color: var(--accent); }
  .mini-send.active.del .mini-send-letter { color: var(--teal); }
  .mini-send.active.drv .mini-send-ind { background: var(--red); box-shadow: 0 0 4px var(--red); }
  .mini-send.active.drv .mini-send-body { box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 0 0 1px oklch(0.55 0.18 25 / 0.55), 0 0 6px oklch(0.55 0.18 25 / 0.35); }
  .mini-send.active.drv .mini-send-letter { color: var(--red); }

  /* MIX button */
  .mix-btn {
    height: 56px;
    padding: 0 14px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.2em;
    box-shadow: var(--shadow-inset);
    transition: all 0.15s;
  }
  .mix-btn:hover { color: var(--accent); border-color: var(--line-2); transform: translateY(-1px); }
  .mix-btn-dot { width: 8px; height: 8px; border-radius: 2px; background: linear-gradient(135deg, var(--accent), var(--teal)); box-shadow: 0 0 8px rgba(245,168,80,0.4); }

  /* MIX modal sections */
  .mix-modal { width: min(640px, 96vw); }
  .mix-section { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed rgba(60, 50, 40, 0.4); }
  .mix-section:last-child { border-bottom: none; padding-bottom: 0; }
  .mix-section-title {
    font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint);
    margin-bottom: 12px;
  }
  .mix-section-foot {
    font-size: 9px; letter-spacing: 0.05em; color: var(--ink-faint);
    margin-top: 8px;
  }
  .mix-glue-row { display: flex; align-items: center; gap: 22px; }
  .mix-glue-meaning {
    font-size: 11px; color: var(--ink-dim);
    line-height: 1.6;
  }
  .mix-glue-foot { margin-top: 6px; color: var(--ink-faint); font-size: 10px; }
  .sc-controls { display: flex; align-items: center; gap: 16px; }
  .sc-targets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    flex: 1;
  }
  .sc-target {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.12s;
    user-select: none;
  }
  .sc-target:hover { border-color: var(--line-2); }
  .sc-target.on {
    background: linear-gradient(180deg, #2b2014, #1a130c);
    color: var(--accent);
    border-color: oklch(0.55 0.14 60);
    box-shadow: 0 0 0 1px oklch(0.55 0.14 60 / 0.3);
  }
  .sc-target.kick {
    opacity: 0.5;
    background: linear-gradient(180deg, #1a1a1a, #101010);
    cursor: not-allowed;
  }
  .sc-target input { width: 12px; height: 12px; }
  .sc-target-num { font-family: "Space Grotesk", sans-serif; font-weight: 700; color: var(--ink-faint); }
  .sc-target.on .sc-target-num { color: var(--accent); }
  .sc-target-name { letter-spacing: 0.08em; }
  .json-btn.auto-mix { background: linear-gradient(180deg, oklch(0.78 0.16 65), oklch(0.62 0.18 55)); color: #1a0f04; border-color: oklch(0.5 0.15 50); font-weight: 700; padding: 0 20px; }

  /* --- Sequencer body (tightened for 8 rows) --- */
  .body {
    background: linear-gradient(180deg, #120e0a, #0c0907);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 12px 18px 10px;
    box-shadow: var(--shadow-inset);
  }
  .rows { display: flex; flex-direction: column; gap: 4px; }
  .row {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 18px;
    align-items: center;
    padding: 2px 0;
    border-bottom: 1px dashed rgba(60, 50, 40, 0.4);
    transition: opacity 0.2s;
  }
  .row.pitched .row-name { background: oklch(0.78 0.13 295 / 0.06); border: 1px dashed oklch(0.5 0.10 295 / 0.4); }
  .row.pitched .row-name:hover { background: oklch(0.78 0.13 295 / 0.10); border-color: oklch(0.6 0.10 295 / 0.55); }
  .row-name.continuous { background: oklch(0.78 0.13 195 / 0.06); border: 1px dashed oklch(0.5 0.10 195 / 0.4); }
  .row-name.continuous:hover { background: oklch(0.78 0.13 195 / 0.10); border-color: oklch(0.6 0.10 195 / 0.55); }
  .slot-bed-tag {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: oklch(0.78 0.13 195);
    border: 1px solid oklch(0.4 0.10 195 / 0.6);
    border-radius: 3px;
    padding: 0 4px;
    margin-left: 4px;
    flex-shrink: 0;
  }
  .row:last-child { border-bottom: none; }
  .row.muted { opacity: 0.42; }
  .row.muted .step.on .step-led,
  .row.muted .step.on.v0 .step-led,
  .row.muted .step.on.v1 .step-led,
  .row.muted .step.on.v2 .step-led { background: var(--ink-faint); box-shadow: none; }
  .row.muted .step-prob-dot { opacity: 0.3; }

  .row-ctrls { display: flex; align-items: center; gap: 8px; min-width: 0; }
  /* All the right-side controls live in one cluster. Use CSS Grid with a fixed
     5-column layout: R/D/X + gear + mute on row 1, MEL (when present) spanning
     all 5 columns on row 2. Grid columns are sized to content, so the cluster
     width is locked to the natural width of the five compact controls — MEL
     can't blow up the cluster like it would under flex with basis:100%. */
  .row-cluster {
    display: grid;
    grid-template-columns: repeat(5, min-content);
    grid-auto-rows: min-content;
    gap: 4px;
    align-items: center;
    justify-items: center;
    margin-left: auto;
    flex-shrink: 0;
  }
  /* Second row: FOLLOW pins to column 1 of row 2 when present, MEL takes
     columns 2-5. When FOLLOW is absent (chord-stab / non-pitched), MEL alone
     spans the whole 5-column row via the :not(:has(...)) override. */
  .row-cluster .follow-btn {
    grid-column: 1 / 2;
    grid-row: 2;
    height: 18px;
    width: 100%;
    justify-self: stretch;
  }
  .row-cluster .mel-btn {
    grid-column: 2 / -1;
    grid-row: 2;
    height: 18px;
    width: 100%;
    justify-self: stretch;
  }
  .row-cluster:not(:has(.follow-btn)) .mel-btn {
    grid-column: 1 / -1;
  }

  /* Row label + sample slot */
  .row-name-wrap { display: flex; align-items: center; gap: 6px; min-width: 130px; position: relative; }
  .row-num { font-size: 9px; color: var(--ink-faint); letter-spacing: 0.15em; }
  .row-name {
    flex: 1;
    display: flex; align-items: center; gap: 4px;
    height: 22px;
    padding: 0 8px;
    background: transparent;
    border: 1px dashed transparent;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 0;
  }
  .row-name:hover {
    background: rgba(60, 50, 40, 0.2);
    border-color: var(--line);
  }
  .row-name.drag {
    background: oklch(0.78 0.16 65 / 0.12);
    border: 1px dashed var(--accent);
  }
  .row-name.has-sample {
    background: linear-gradient(180deg, #1f1812, #15110c);
    border: 1px solid var(--line-2);
    cursor: pointer;
  }
  .row-name.has-sample:hover { border-color: var(--accent); }
  .row-label {
    flex: 1;
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--ink);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .row-name.has-sample .row-label { color: var(--accent); letter-spacing: 0.04em; font-size: 10px; }
  .sample-icon { display: inline-flex; color: var(--accent); flex-shrink: 0; }
  .sample-name { overflow: hidden; text-overflow: ellipsis; }
  .sample-clear {
    width: 16px; height: 16px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .sample-clear:hover { color: #fff; background: var(--red); border-color: var(--red); }
  .instr-name { letter-spacing: 0.15em; }

  .row-pulse {
    position: absolute; top: 50%; left: -6px;
    width: 4px; height: 4px; border-radius: 50%; background: transparent;
    margin-top: -2px; transition: opacity 0.4s;
    animation: rowPulse 0.45s ease-out;
  }
  @keyframes rowPulse {
    0% { background: var(--accent); box-shadow: 0 0 10px var(--accent); opacity: 1; transform: scale(1.5); }
    100% { background: transparent; box-shadow: none; opacity: 0; transform: scale(1); }
  }

  /* Volume slider */
  .vol { position: relative; flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; padding: 0 6px; min-width: 70px; }
  .vol-track { width: 100%; height: 4px; background: #0a0807; border-radius: 2px; box-shadow: inset 0 1px 1px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
  .vol-fill { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg, oklch(0.58 0.14 60), var(--accent)); box-shadow: 0 0 6px rgba(245,168,80,0.4); }
  .vol-thumb { position: absolute; top: 50%; width: 10px; height: 16px; background: linear-gradient(180deg, #4a3f33, #2a2218); border: 1px solid #0a0805; border-radius: 2px; transform: translate(-50%, -50%); pointer-events: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5); }
  .vol-thumb::after { content: ''; position: absolute; inset: 4px 3px; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); }

  /* Mute */
  .mute {
    width: 26px; height: 22px;
    background: linear-gradient(180deg, #1c1812, #120e09);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink-faint);
    font-size: 10px; font-weight: 700;
    box-shadow: var(--shadow-inset);
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .mute:hover { color: var(--ink); }
  .mute.on { background: linear-gradient(180deg, oklch(0.55 0.18 25), oklch(0.4 0.16 25)); color: #fff; border-color: oklch(0.4 0.16 25); box-shadow: 0 0 10px rgba(255, 80, 60, 0.35), inset 0 1px 0 rgba(255,255,255,0.2); }

  /* Steps */
  .steps { display: flex; align-items: center; gap: 6px; }
  .step-gap { width: 12px; flex-shrink: 0; }
  .step {
    flex: 1;
    aspect-ratio: 1 / 1;
    max-width: 56px;
    background: transparent;
    border: none;
    padding: 0;
    position: relative;
    cursor: pointer;
  }
  .step-face {
    position: absolute; inset: 2px;
    background: linear-gradient(180deg, #1c1812, #110d09);
    border: 1px solid var(--line);
    border-radius: 5px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.04),
      inset 0 -2px 2px rgba(0,0,0,0.3),
      0 1px 0 rgba(0,0,0,0.6);
    display: grid;
    place-items: center;
    transition: all 0.12s;
  }
  .step.downbeat .step-face { border-color: var(--line-2); }
  .step:hover .step-face { background: linear-gradient(180deg, #28201a, #19140f); border-color: #4a3f33; transform: translateY(-1px); }
  .step:active .step-face { transform: translateY(0); }
  .step-led {
    width: 70%; height: 70%;
    border-radius: 4px;
    background: #15110c;
    box-shadow: inset 0 0 0 1px #050302, inset 0 1px 1px rgba(0,0,0,0.6);
    transition: all 0.1s;
  }
  .step.on .step-led {
    background: linear-gradient(180deg, oklch(0.85 0.17 70), oklch(0.65 0.18 55));
    box-shadow:
      0 0 14px oklch(0.78 0.16 65 / 0.7),
      0 0 4px oklch(0.85 0.17 70 / 0.9),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 1px rgba(0,0,0,0.3);
  }
  .step.on.v0 .step-led {
    width: 48%; height: 48%;
    background: linear-gradient(180deg, oklch(0.65 0.10 65), oklch(0.5 0.10 55));
    box-shadow:
      0 0 6px oklch(0.6 0.10 65 / 0.5),
      inset 0 1px 0 rgba(255,255,255,0.2),
      inset 0 -1px 1px rgba(0,0,0,0.3);
  }
  .step.on.v2 .step-led {
    width: 78%; height: 78%;
    background: linear-gradient(180deg, oklch(0.92 0.18 75), oklch(0.72 0.20 55));
    box-shadow:
      0 0 26px oklch(0.85 0.18 70 / 0.9),
      0 0 8px oklch(0.95 0.18 75 / 0.95),
      0 0 0 1px oklch(0.85 0.16 70 / 0.55),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -1px 1px rgba(0,0,0,0.3);
  }
  .step-prob {
    position: absolute;
    top: 4px; right: 4px;
    width: 8px; height: 8px;
    pointer-events: none;
  }
  .step-prob-dot {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid oklch(0.85 0.04 70 / 0.7);
    background: oklch(0.18 0.02 60 / 0.7);
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }
  .step-prob-dot[data-p="75"] { background: conic-gradient(oklch(0.85 0.10 70) 0 270deg, oklch(0.18 0.02 60 / 0.85) 270deg 360deg); }
  .step-prob-dot[data-p="50"] { background: conic-gradient(oklch(0.85 0.10 70) 0 180deg, oklch(0.18 0.02 60 / 0.85) 180deg 360deg); }
  .step-prob-dot[data-p="25"] { background: conic-gradient(oklch(0.85 0.10 70) 0 90deg,  oklch(0.18 0.02 60 / 0.85) 90deg  360deg); }
  .step.on.current .step-face {
    background: linear-gradient(180deg, #2e2418, #1c1410);
    border-color: oklch(0.6 0.14 60);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 0 0 1px oklch(0.6 0.14 60 / 0.3),
      0 0 16px oklch(0.7 0.15 60 / 0.25);
  }
  .step.current .step-face {
    background: linear-gradient(180deg, #2e2418, #1c1410);
    border-color: oklch(0.6 0.14 60);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 0 0 1px oklch(0.6 0.14 60 / 0.3),
      0 0 16px oklch(0.7 0.15 60 / 0.25);
  }
  .step.on.current .step-led {
    background: linear-gradient(180deg, oklch(0.92 0.18 75), oklch(0.78 0.18 60));
    box-shadow:
      0 0 22px oklch(0.85 0.17 70 / 0.9),
      0 0 8px oklch(0.95 0.17 80 / 1),
      inset 0 1px 0 rgba(255,255,255,0.55);
    animation: stepHit 0.25s ease-out;
  }
  .step.on.v2.current .step-led {
    box-shadow:
      0 0 30px oklch(0.9 0.18 75 / 1),
      0 0 12px oklch(0.98 0.17 80 / 1),
      0 0 0 1px oklch(0.85 0.16 70 / 0.7),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .step.on.v0.current .step-led {
    box-shadow:
      0 0 12px oklch(0.7 0.12 65 / 0.8),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  @keyframes stepHit {
    0% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* MEL toggle button (per pitched slot) */
  .mel-btn {
    height: 22px;
    padding: 0 6px;
    background: linear-gradient(180deg, #1c1812, #120e09);
    border: 1px solid var(--line);
    color: var(--ink-faint);
    border-radius: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.15em;
    box-shadow: var(--shadow-inset);
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .mel-btn:hover { color: oklch(0.85 0.14 295); border-color: oklch(0.5 0.12 295); }
  .mel-btn.on {
    color: #1a0f04;
    background: linear-gradient(180deg, oklch(0.78 0.14 295), oklch(0.62 0.18 285));
    border-color: oklch(0.5 0.12 285);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 8px oklch(0.55 0.13 295 / 0.4);
  }
  /* FOLLOW (chord-follow) toggle — green-ish accent to differentiate from MEL */
  .follow-btn {
    height: 22px;
    padding: 0 6px;
    background: linear-gradient(180deg, #1c1812, #120e09);
    border: 1px solid var(--line);
    color: var(--ink-faint);
    border-radius: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    box-shadow: var(--shadow-inset);
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .follow-btn:hover { color: oklch(0.85 0.14 145); border-color: oklch(0.5 0.13 145); }
  .follow-btn.on {
    color: #0a1b0a;
    background: linear-gradient(180deg, oklch(0.78 0.13 145), oklch(0.62 0.16 140));
    border-color: oklch(0.5 0.13 145);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 8px oklch(0.55 0.13 145 / 0.4);
  }

  /* Melody editor (piano roll) — uses the same column flex as the regular .steps
     grid so cells align vertically with non-melody rows in the same bank. */
  .melody-editor {
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #0f0c08, #0a0807);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 0 6px 0;
  }
  .melody-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 9px; letter-spacing: 0.2em; color: var(--ink-faint);
    margin-bottom: 4px;
    padding: 0 8px;
  }
  .melody-title { color: oklch(0.85 0.14 295); }
  .melody-poly { color: var(--ink-dim); margin-left: 4px; }
  .melody-key { display: flex; align-items: center; gap: 6px; font-size: 9px; letter-spacing: 0.18em; }
  .melody-key select {
    background: #0a0807; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    font-size: 10px; padding: 2px 4px;
  }
  .melody-grid { display: flex; flex-direction: column; gap: 0; padding: 0; }
  /* Match the regular .steps row layout exactly so cells align column-for-column */
  .melody-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px 0 0;
    border-top: 1px solid transparent;
  }
  .melody-row.black { background: rgba(0,0,0,0.32); }
  .melody-row.octave { border-top-color: var(--line-2); }
  .melody-row.root { background: oklch(0.78 0.16 65 / 0.06); }
  .melody-row.root.black { background: oklch(0.78 0.16 65 / 0.10); }
  .melody-row.oos { opacity: 0.7; }
  .melody-row .step.melody-cell {
    /* override .step's square aspect-ratio — melody rows are short bars */
    aspect-ratio: auto;
    height: 12px;
    max-width: 56px;
    border-radius: 2px;
    background: linear-gradient(180deg, #1c1812, #110d09);
    border: 1px solid var(--line);
    padding: 0;
    position: relative;
    cursor: pointer;
    transition: background 0.08s, border-color 0.08s;
  }
  .melody-row .step.melody-cell:hover { border-color: #5a4d3f; }
  .melody-row .step.melody-cell.downbeat { border-left-color: var(--line-2); }
  .melody-row .step.melody-cell.current { background: linear-gradient(180deg, #2a2018, #1a130d); border-color: oklch(0.6 0.14 60); }
  .melody-row .step.melody-cell.on {
    background: linear-gradient(180deg, oklch(0.85 0.14 295), oklch(0.6 0.16 285));
    border-color: oklch(0.5 0.12 285);
    box-shadow: 0 0 6px oklch(0.6 0.14 290 / 0.5), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .melody-row .step.melody-cell.on.v0 { background: linear-gradient(180deg, oklch(0.7 0.10 295), oklch(0.5 0.12 285)); }
  .melody-row .step.melody-cell.on.v2 { background: linear-gradient(180deg, oklch(0.92 0.16 295), oklch(0.72 0.18 285)); box-shadow: 0 0 12px oklch(0.7 0.16 290 / 0.7), inset 0 1px 0 rgba(255,255,255,0.4); }
  .melody-row .step.melody-cell.on.prob { opacity: 0.75; }
  /* Sustain tail — dimmer than head, velocity still scales the tint */
  .melody-row .step.melody-cell.tail {
    background: linear-gradient(180deg, oklch(0.85 0.14 295 / 0.50), oklch(0.6 0.16 285 / 0.50));
    border-color: oklch(0.5 0.12 285 / 0.45);
    box-shadow: none;
    cursor: default;
  }
  .melody-row .step.melody-cell.tail.v0 { background: linear-gradient(180deg, oklch(0.7 0.10 295 / 0.35), oklch(0.5 0.12 285 / 0.35)); }
  .melody-row .step.melody-cell.tail.v2 { background: linear-gradient(180deg, oklch(0.92 0.16 295 / 0.65), oklch(0.72 0.18 285 / 0.65)); }
  .melody-row .step.melody-cell.tail .melody-cell-label { opacity: 0.6; }
  /* Drag preview note flashes at ~75% so the user sees it's not committed yet */
  .melody-row .step.melody-cell.preview { animation: melPreviewPulse 0.6s ease-in-out infinite; }
  @keyframes melPreviewPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.2); } }
  /* Small length-counter badge over the head while dragging */
  .melody-drag-length {
    position: absolute;
    top: -10px; right: -2px;
    background: oklch(0.85 0.14 295);
    color: #1a0f04;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700; font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    z-index: 2;
  }
  /* Tiny note-name overlay on the first cell of each row, doesn't affect layout */
  .melody-cell-label {
    position: absolute;
    left: 2px; top: 50%;
    transform: translateY(-50%);
    font-size: 7px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    color: var(--ink-faint);
    pointer-events: none;
    letter-spacing: 0;
    line-height: 1;
  }
  .melody-row.root .melody-cell-label { color: var(--accent); font-weight: 700; }
  .melody-row.oos .melody-cell-label { opacity: 0.5; }
  .melody-row .step.melody-cell.on .melody-cell-label { color: rgba(255,255,255,0.7); }
  .melody-hint {
    margin-top: 6px;
    padding: 0 8px;
    font-size: 8px; letter-spacing: 0.15em; color: var(--ink-faint); opacity: 0.7;
    text-align: center;
  }

  /* Slot gear (settings popover trigger) */
  .slot-gear {
    width: 22px; height: 22px;
    background: linear-gradient(180deg, #1c1812, #120e09);
    border: 1px solid var(--line);
    color: var(--ink-faint);
    border-radius: 4px;
    font-size: 14px; line-height: 1;
    box-shadow: var(--shadow-inset);
    transition: all 0.12s;
    flex-shrink: 0;
    padding: 0;
  }
  .slot-gear:hover { color: var(--ink); border-color: var(--line-2); }
  .slot-gear.has { color: var(--accent); }
  .slot-gear.has:hover { color: oklch(0.92 0.15 70); border-color: oklch(0.55 0.14 60); }

  /* Pitched step note overlay */
  .step.pitched .step-note {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: "Space Grotesk", sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #1a0f04;
    pointer-events: none;
    letter-spacing: 0.02em;
    text-shadow: 0 0 4px rgba(255,255,255,0.5);
  }
  .step.pitched.on .step-led {
    background: linear-gradient(180deg, oklch(0.85 0.14 295), oklch(0.65 0.16 285));
    box-shadow:
      0 0 14px oklch(0.78 0.14 290 / 0.7),
      0 0 4px oklch(0.85 0.14 290 / 0.9),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 1px rgba(0,0,0,0.3);
  }
  .step.pitched.on.v2 .step-led {
    background: linear-gradient(180deg, oklch(0.92 0.16 295), oklch(0.72 0.18 285));
    box-shadow:
      0 0 24px oklch(0.85 0.16 290 / 0.9),
      0 0 8px oklch(0.95 0.16 295 / 0.95),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .step.pitched.on.v0 .step-led {
    background: linear-gradient(180deg, oklch(0.65 0.10 295), oklch(0.5 0.10 285));
  }
  .step.pitched.on.current .step-led {
    background: linear-gradient(180deg, oklch(0.95 0.18 295), oklch(0.78 0.18 285));
    box-shadow:
      0 0 24px oklch(0.85 0.16 290 / 1),
      0 0 8px oklch(0.98 0.16 290 / 1),
      inset 0 1px 0 rgba(255,255,255,0.55);
  }

  /* ---------- Popovers ---------- */
  .popover {
    position: fixed;
    background: linear-gradient(180deg, #1c1812, #12100c);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
    z-index: 70;
    padding: 8px 8px 8px;
    max-width: 480px;
  }
  .popover-header {
    font-size: 9px; letter-spacing: 0.3em; color: var(--accent);
    padding: 4px 6px 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
  }
  .popover-empty { font-size: 11px; color: var(--ink-faint); padding: 6px; }
  .popover-footnote {
    font-size: 9px; color: var(--ink-faint); letter-spacing: 0.15em;
    padding: 6px 2px 0; text-align: center;
    border-top: 1px dashed rgba(60, 50, 40, 0.4);
    margin-top: 6px;
  }

  .popover-search {
    width: 100%;
    background: #0a0807;
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    padding: 6px 10px;
    margin-bottom: 8px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .popover-search:focus { outline: none; border-color: var(--accent); }
  .popover-search::placeholder { color: var(--ink-faint); letter-spacing: 0.08em; }

  .palette-popover { width: 460px; max-height: 72vh; overflow-y: auto; }
  .palette-item-tag.bed {
    color: oklch(0.78 0.13 195);
    border-color: oklch(0.4 0.10 195 / 0.6);
  }
  .palette-item.continuous.active {
    color: oklch(0.85 0.13 195); border-color: oklch(0.5 0.12 195);
    box-shadow: 0 0 0 1px oklch(0.5 0.12 195 / 0.55);
  }

  /* Kits popover */
  .kits-popover { width: 380px; max-height: 70vh; overflow-y: auto; }
  .kits-list { display: flex; flex-direction: column; gap: 4px; }
  .kit-item {
    text-align: left;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 12px;
    transition: all 0.12s;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 2px;
  }
  .kit-item:hover { border-color: var(--line-2); transform: translateX(2px); background: linear-gradient(180deg, #221c14, #18120d); }
  .kit-item.active {
    border-color: oklch(0.55 0.14 60);
    background: linear-gradient(180deg, #2b2014, #1a130c);
    box-shadow: 0 0 0 1px oklch(0.55 0.14 60 / 0.4);
  }
  .kit-item-name { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.05em; color: var(--accent); }
  .kit-item.active .kit-item-name { color: var(--accent); }
  .kit-item-desc { font-size: 10px; color: var(--ink-dim); letter-spacing: 0.02em; line-height: 1.4; }
  .palette-grid { display: flex; flex-direction: column; gap: 8px; }
  .palette-group-label { font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); margin-bottom: 4px; }
  .palette-group-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .palette-item {
    position: relative;
    height: 26px;
    padding: 0 9px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 5px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    transition: all 0.12s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .palette-item:hover { color: var(--ink); border-color: var(--line-2); transform: translateY(-1px); }
  .palette-item.active {
    color: var(--accent); border-color: oklch(0.55 0.14 60);
    background: linear-gradient(180deg, #2b2014, #1a130c);
    box-shadow: 0 0 0 1px oklch(0.55 0.14 60 / 0.4);
  }
  .palette-item.pitched.active { color: oklch(0.85 0.14 295); border-color: oklch(0.5 0.12 295); box-shadow: 0 0 0 1px oklch(0.5 0.12 295 / 0.55); }
  .palette-item-tag {
    font-size: 8px; letter-spacing: 0.05em;
    color: oklch(0.78 0.13 295);
    border: 1px solid oklch(0.4 0.10 295 / 0.6);
    border-radius: 3px;
    padding: 0 3px;
  }

  /* Note picker */
  .note-picker { width: 240px; }
  .note-picker-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px;
    max-height: 280px; overflow-y: auto;
  }
  .note-item {
    height: 22px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    transition: all 0.12s;
  }
  .note-item:hover { color: var(--ink); border-color: var(--line-2); }
  .note-item.default { color: var(--ink); }
  .note-item.active {
    color: oklch(0.85 0.14 295); border-color: oklch(0.5 0.12 295);
    background: oklch(0.2 0.06 295 / 0.4);
    box-shadow: 0 0 6px oklch(0.5 0.12 295 / 0.5);
  }

  /* Slot settings */
  .slot-settings { width: 320px; }
  .slot-settings-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 6px; }
  .setting-row { display: flex; align-items: center; gap: 10px; }
  .setting-label {
    font-size: 9px; letter-spacing: 0.25em; color: var(--ink-faint);
    width: 56px; flex-shrink: 0;
  }
  .setting-readout { font-size: 10px; color: var(--ink); min-width: 24px; text-align: right; font-family: "JetBrains Mono", ui-monospace, monospace; }
  .toggle {
    width: 48px; height: 22px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.2em;
    box-shadow: var(--shadow-inset);
  }
  .toggle.on {
    background: linear-gradient(180deg, oklch(0.78 0.16 65), oklch(0.62 0.18 55));
    color: #1a0f04;
    border-color: oklch(0.5 0.15 50);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 8px rgba(245,168,80,0.4);
  }
  .setting-pills { display: flex; gap: 3px; flex-wrap: wrap; }
  .pill {
    height: 22px; padding: 0 8px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .pill:hover { color: var(--ink); border-color: var(--line-2); }
  .pill.on {
    color: var(--accent); border-color: oklch(0.55 0.14 60);
    background: linear-gradient(180deg, #2b2014, #1a130c);
  }
  .settings-slider { position: relative; flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; }
  .settings-slider-track { width: 100%; height: 4px; background: #0a0807; border-radius: 2px; box-shadow: inset 0 1px 1px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
  .settings-slider-fill { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg, oklch(0.58 0.14 60), var(--accent)); box-shadow: 0 0 6px rgba(245,168,80,0.4); }
  .settings-slider-thumb { position: absolute; top: 50%; width: 10px; height: 14px; background: linear-gradient(180deg, #4a3f33, #2a2218); border: 1px solid #0a0805; border-radius: 2px; transform: translate(-50%, -50%); pointer-events: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5); }

  /* Column number strip */
  .col-strip { display: grid; grid-template-columns: 360px 1fr; gap: 18px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .col-strip-left { display: flex; align-items: center; padding-left: 4px; }
  .col-strip-left .hint { font-size: 9px; letter-spacing: 0.16em; color: var(--ink-faint); opacity: 0.8; }
  .col-strip-steps { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 0; }
  .col-num {
    flex: 1;
    max-width: 56px;
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    padding: 2px 0;
    border-radius: 3px;
    transition: all 0.1s;
  }
  .col-num.down { color: var(--ink-dim); font-weight: 700; }
  .col-num.active { color: var(--accent); background: oklch(0.78 0.16 65 / 0.12); text-shadow: 0 0 8px var(--accent-glow); }

  /* Footer */
  .footer { padding: 6px 8px 2px; display: flex; justify-content: space-between; align-items: center; }
  .footer-text { font-size: 10px; letter-spacing: 0.22em; color: var(--ink-faint); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sub-tag { color: var(--accent); opacity: 0.75; margin-left: 4px; letter-spacing: 0.12em; }
  .sep { opacity: 0.4; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); display: inline-block; }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(5,3,2,0.75); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 100; }
  .modal {
    width: min(440px, 90vw);
    background: linear-gradient(180deg, #1a1612, #100c09);
    border: 1px solid var(--line-2);
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .modal-header {
    padding: 14px 18px;
    font-size: 11px; letter-spacing: 0.3em; color: var(--accent);
    border-bottom: 1px solid var(--line);
    background: #14100c;
  }
  .modal-body { padding: 22px 20px; }
  .modal-progress {
    height: 10px;
    background: #0a0807;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .modal-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, oklch(0.58 0.14 60), var(--accent));
    box-shadow: 0 0 12px rgba(245,168,80,0.6);
    transition: width 0.15s linear;
  }
  .modal-progress-text {
    margin-top: 10px;
    font-size: 10px; letter-spacing: 0.25em; color: var(--ink-dim); text-align: center;
  }
  .modal-hint {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px dashed rgba(60, 50, 40, 0.4);
    font-size: 10px; letter-spacing: 0.04em; color: var(--ink-faint);
    text-align: center;
  }

  /* JSON cluster (Import / Export / AI) */
  .json-cluster {
    display: flex;
    flex-direction: column;
    background: #100c09;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px 6px;
    gap: 4px;
    min-width: 0;
  }
  .json-cluster-label {
    font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint);
  }
  .json-cluster-btns { display: flex; gap: 3px; }
  .json-cluster-btn {
    height: 22px;
    padding: 0 8px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.18em;
    box-shadow: var(--shadow-inset);
    transition: all 0.12s;
  }
  .json-cluster-btn:hover { color: var(--accent); border-color: var(--line-2); transform: translateY(-1px); }
  .json-cluster-btn.ai {
    background: linear-gradient(180deg, #1f1a25, #15101c);
    color: oklch(0.78 0.13 295);
    border-color: oklch(0.4 0.10 295 / 0.5);
  }
  .json-cluster-btn.ai:hover { color: oklch(0.88 0.15 295); border-color: oklch(0.55 0.13 295); box-shadow: 0 0 8px oklch(0.55 0.13 295 / 0.35), var(--shadow-inset); }
  .json-cluster-btn.share {
    background: linear-gradient(180deg, #14201f, #0e1816);
    color: var(--teal);
    border-color: oklch(0.4 0.10 195 / 0.5);
  }
  .json-cluster-btn.share:hover { color: oklch(0.9 0.13 195); border-color: oklch(0.55 0.13 195); box-shadow: 0 0 8px oklch(0.55 0.13 195 / 0.35), var(--shadow-inset); }

  /* Share modal */
  .share-hint {
    font-size: 11px; color: var(--ink-dim);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .share-url {
    display: block;
    width: 100%;
    background: #0a0807;
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    padding: 8px 10px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
    word-break: break-all;
  }
  .share-url:focus { outline: none; border-color: var(--accent); }
  .share-meta {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }
  .share-meta.warn {
    color: var(--accent);
    background: oklch(0.2 0.04 70 / 0.18);
    border: 1px solid oklch(0.45 0.10 70 / 0.4);
    border-radius: 5px;
    padding: 6px 10px;
  }

  /* Wide modal variant for JSON import/export */
  .modal-wide { width: min(720px, 94vw); }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    width: 22px; height: 22px;
    border-radius: 4px;
    font-size: 16px;
    line-height: 1;
    padding: 0;
    display: grid; place-items: center;
  }
  .modal-close:hover { color: var(--ink); border-color: var(--line-2); }

  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 16px;
  }

  .json-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px;
    padding: 0 14px;
    background: linear-gradient(180deg, #1c1812, #14100c);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.2em;
    font-family: inherit;
    box-shadow: var(--shadow-inset);
    transition: all 0.15s;
    cursor: pointer;
  }
  .json-btn:hover { color: var(--accent); border-color: var(--line-2); transform: translateY(-1px); }
  .json-btn.ghost { color: var(--ink-faint); }
  .json-btn.primary {
    background: linear-gradient(180deg, oklch(0.78 0.16 65), oklch(0.62 0.18 55));
